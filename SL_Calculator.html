<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Real-time % Calculator</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; padding: 16px; }
    input { padding: 6px 8px; font-size: 16px; }
    .out { margin-top: 10px; display: grid; gap: 6px; max-width: 420px; }
    .row { display: flex; justify-content: space-between; gap: 12px; }
    .row span:first-child { color: #444; }
    .row span:last-child { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <label>
    Enter number (decimal):
    <input id="base" type="number" step="any" value="100" />
  </label>
<label>
    Enter Quantity:
    <input id="quantity" type="number" step="any" value="100" />
  </label>
  <div class="out" id="out"></div>
<style>
  .row{
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 6px 12px;
  border-bottom: 1px solid #2980b9;
  border: 2px solid #2980b9;
}

.row:last-child{ border-bottom: none; }

.row span:first-child { color: #444; }
.row span:nth-child(2),
.row span:nth-child(3),
.row span:nth-child(4) { font-variant-numeric: tabular-nums; }

</style>

  <script>
  const deltasPercent = [-0.1, -0.2, -0.5, -0.8, -1, 0.2, 0.5, 1, 1.2, 1.5, 1.8, 2, 2.5, 3]; // in percent

  const baseInput = document.getElementById('base');
  const quantityInput = document.getElementById('quantity');
  const out = document.getElementById('out');

  function fmt(n) {
    if (!Number.isFinite(n)) return '—';
    return n.toLocaleString(undefined, { maximumFractionDigits: 6 });
  }

  function render() {
    const base = Number(baseInput.value);
    const qty = Number(quantityInput.value);

    const baseTimesQty = base * qty;

    out.innerHTML = '';

    deltasPercent.forEach(p => {
      const updated = base * (1 + p / 100);      // base after %
      const adjacentTotal = updated * qty;       // multiplied by qty
      const difference = baseTimesQty - adjacentTotal;

      const sign = p > 0 ? '+' : '';
      const label = `${sign}${p}%`;

      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `
        <span>${label}</span>
        <span>${fmt(updated)}</span>
        <span>${fmt(adjacentTotal)}</span>
        <span>${fmt(difference)}</span>
      `;
      out.appendChild(row);
    });
  }

  baseInput.addEventListener('input', render);
  quantityInput.addEventListener('input', render);
  render();
</script>



</body>
</html>
